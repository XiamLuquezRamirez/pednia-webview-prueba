name: Compilar APK PedNia

# Se ejecuta al hacer push y también manualmente (botón "Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Generar Gradle wrapper
        # El repo no incluye el gradle-wrapper.jar (binario); Gradle lo crea aquí.
        run: gradle wrapper --gradle-version 8.9

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar la APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: pednia-kiosco-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
